name: Template CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Template checks
    uses: ./.github/workflows/python-uv.yml
    with:
      python-version: '3.15.2'
      install-dependencies: false
      validation-command: |
        uv --version
        actionlint -version
        uv run --no-project --python 3.15.2 python -c "import sys; assert sys.version_info[:3] == (3, 15, 2)"
